<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolfy World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: #1a1a2e;
            color: white;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            position: relative;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        /* Pantalla de diálogo */
        #dialogue-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }

        .dialogue-box {
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #00e5ff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }

        .speaker-name {
            color: #00e5ff;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00e5ff;
        }

        .dialogue-text {
            font-size: 1.1em;
            line-height: 1.6;
            min-height: 60px;
            margin-bottom: 15px;
        }

        .continue-btn {
            background: #00e5ff;
            color: #1a1a2e;
            border: none;
            padding: 10px 30px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .continue-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #00e5ff;
        }

        /* Input de nombre */
        #name-input-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
        }

        .name-input-container {
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #00e5ff;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }

        .name-input-container h2 {
            color: #00e5ff;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        #nickname-input {
            width: 300px;
            padding: 12px;
            font-size: 1.1em;
            border: 2px solid #00e5ff;
            border-radius: 8px;
            background: #1a1a2e;
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }

        #nickname-input:focus {
            outline: none;
            box-shadow: 0 0 10px #00e5ff;
        }

        /* Pantalla de carga */
        #loading-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
        }

        .loading-text {
            font-size: 1.5em;
            color: #00e5ff;
            margin-bottom: 20px;
        }

        .loading-bar-container {
            width: 80%;
            max-width: 400px;
            height: 30px;
            background: #16213e;
            border: 2px solid #00e5ff;
            border-radius: 15px;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #00e5ff, #00ff88);
            width: 0%;
            transition: width 0.3s;
            box-shadow: 0 0 10px #00e5ff;
        }

        .loading-percentage {
            margin-top: 15px;
            font-size: 1.2em;
            color: #00e5ff;
        }

        /* Transición a blanco */
        #white-transition {
            position: absolute;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s;
        }

        /* Tutorial */
        #tutorial-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px;
        }

        .tutorial-title {
            font-size: 2em;
            color: #00e5ff;
            margin-bottom: 30px;
            text-shadow: 0 0 15px #00e5ff;
        }

        .characters-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 600px;
            width: 100%;
        }

        .character-card {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00e5ff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .character-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #00e5ff;
        }

        .character-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .character-name {
            font-size: 1.2em;
            color: #00e5ff;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .character-role {
            font-size: 0.9em;
            color: #ccc;
        }

        .start-game-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.3em;
            background: #00e5ff;
            color: #1a1a2e;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .start-game-btn:hover {
            background: #fff;
            box-shadow: 0 0 20px #00e5ff;
            transform: scale(1.1);
        }

        /* Animación de texto */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Pantalla de diálogo inicial -->
        <div id="dialogue-screen">
            <div class="dialogue-box">
                <div class="speaker-name" id="speaker">???</div>
                <div class="dialogue-text" id="dialogue-text"></div>
                <button class="continue-btn" id="continue-btn" onclick="nextDialogue()">Continuar ▶</button>
            </div>
        </div>

        <!-- Input de nombre -->
        <div id="name-input-screen">
            <div class="name-input-container">
                <h2>¿Cómo te llamas?</h2>
                <input type="text" id="nickname-input" placeholder="Tu nombre..." maxlength="20">
                <br>
                <button class="continue-btn" onclick="submitName()">Aceptar</button>
            </div>
        </div>

        <!-- Pantalla de carga -->
        <div id="loading-screen">
            <div class="loading-text">Cargando datos básicos...</div>
            <div class="loading-bar-container">
                <div class="loading-bar" id="loading-bar"></div>
            </div>
            <div class="loading-percentage" id="loading-percentage">0%</div>
        </div>

        <!-- Transición a blanco -->
        <div id="white-transition"></div>

        <!-- Tutorial -->
        <div id="tutorial-screen">
            <h1 class="tutorial-title">Conoce a tus compañeros</h1>
            <div class="characters-grid">
                <div class="character-card">
                    <div class="character-icon">🐺</div>
                    <div class="character-name">Lobito</div>
                    <div class="character-role">El líder valiente</div>
                </div>
                <div class="character-card">
                    <div class="character-icon">⚔️</div>
                    <div class="character-name">Lobito Espadachín</div>
                    <div class="character-role">Maestro del combate</div>
                </div>
                <div class="character-card">
                    <div class="character-icon">🏹</div>
                    <div class="character-name">Lobito Arquero</div>
                    <div class="character-role">Precisión letal</div>
                </div>
                <div class="character-card">
                    <div class="character-icon">📚</div>
                    <div class="character-name">Lobito Escolar</div>
                    <div class="character-role">Estratega inteligente</div>
                </div>
            </div>
            <button class="start-game-btn" onclick="startGame()">¡Comenzar Aventura!</button>
        </div>
    </div>

    <script>
        // Secuencia de diálogos
        const dialogues = [
            { speaker: "???", text: "Hey" },
            { speaker: "???", text: "Bienvenido a este proyecto" },
            { speaker: "???", text: "Me da curiosidad saber quien eres" }
        ];

        let currentDialogue = 0;
        let playerName = "";
        let isTyping = false;
        let typingTimeout;

        // Iniciar diálogo
        function startDialogue() {
            showDialogue(dialogues[currentDialogue]);
        }

        // Mostrar diálogo con efecto typewriter
        function showDialogue(dialogue) {
            const speakerEl = document.getElementById('speaker');
            const textEl = document.getElementById('dialogue-text');
            const btnEl = document.getElementById('continue-btn');

            speakerEl.textContent = dialogue.speaker;
            textEl.textContent = "";
            btnEl.style.display = 'none';

            // Efecto typewriter
            isTyping = true;
            let charIndex = 0;
            
            function typeChar() {
                if (charIndex < dialogue.text.length) {
                    textEl.textContent += dialogue.text.charAt(charIndex);
                    charIndex++;
                    typingTimeout = setTimeout(typeChar, 50);
                } else {
                    isTyping = false;
                    btnEl.style.display = 'inline-block';
                }
            }

            typeChar();
        }

        // Avanzar diálogo
        function nextDialogue() {
            if (isTyping) {
                // Si está escribiendo, completar el texto inmediatamente
                clearTimeout(typingTimeout);
                document.getElementById('dialogue-text').textContent = dialogues[currentDialogue].text;
                isTyping = false;
                document.getElementById('continue-btn').style.display = 'inline-block';
                return;
            }

            currentDialogue++;

            if (currentDialogue < dialogues.length) {
                showDialogue(dialogues[currentDialogue]);
            } else {
                // Mostrar input de nombre
                document.getElementById('dialogue-screen').style.display = 'none';
                document.getElementById('name-input-screen').style.display = 'flex';
                document.getElementById('nickname-input').focus();
            }
        }

        // Enviar nombre
        function submitName() {
            playerName = document.getElementById('nickname-input').value.trim();
            
            if (playerName === "") {
                alert("¡Por favor ingresa un nombre!");
                return;
            }

            // Continuar con el diálogo personalizado
            document.getElementById('name-input-screen').style.display = 'none';
            document.getElementById('dialogue-screen').style.display = 'flex';

            const customDialogue = {
                speaker: "???",
                text: `Ah, ${playerName}, que gran nombre. Empecemos con la carga de unos datos básicos ¿te parece?`
            };

            showDialogue(customDialogue);

            // Sobrescribir nextDialogue para ir a la pantalla de carga
            window.nextDialogue = function() {
                if (isTyping) {
                    clearTimeout(typingTimeout);
                    document.getElementById('dialogue-text').textContent = customDialogue.text;
                    isTyping = false;
                    document.getElementById('continue-btn').style.display = 'inline-block';
                    return;
                }
                startLoading();
            };
        }

        // Pantalla de carga
        function startLoading() {
            document.getElementById('dialogue-screen').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'flex';

            let progress = 0;
            const loadingBar = document.getElementById('loading-bar');
            const loadingPercentage = document.getElementById('loading-percentage');

            const loadingInterval = setInterval(() => {
                progress += Math.random() * 15;
                
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(loadingInterval);
                    
                    setTimeout(() => {
                        showWelcomeMessage();
                    }, 500);
                }

                loadingBar.style.width = progress + '%';
                loadingPercentage.textContent = Math.floor(progress) + '%';
            }, 300);
        }

        // Mensaje de bienvenida
        function showWelcomeMessage() {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('dialogue-screen').style.display = 'flex';

            const welcomeDialogue = {
                speaker: "Sistema",
                text: "Bienvenido al mundo Wolfy"
            };

            showDialogue(welcomeDialogue);

            // Sobrescribir nextDialogue para la transición
            window.nextDialogue = function() {
                if (isTyping) {
                    clearTimeout(typingTimeout);
                    document.getElementById('dialogue-text').textContent = welcomeDialogue.text;
                    isTyping = false;
                    document.getElementById('continue-btn').style.display = 'inline-block';
                    return;
                }
                startWhiteTransition();
            };
        }

        // Transición a blanco
        function startWhiteTransition() {
            document.getElementById('dialogue-screen').style.display = 'none';
            const whiteTransition = document.getElementById('white-transition');
            whiteTransition.style.opacity = '1';

            setTimeout(() => {
                // Mostrar mensaje final durante la transición
                const finalMessage = document.createElement('div');
                finalMessage.style.cssText = `
                    position: absolute;
                    width: 100%;
                    height: 100%;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    font-size: 2em;
                    color: #1a1a2e;
                    font-weight: bold;
                    text-shadow: 0 0 10px rgba(0,0,0,0.3);
                    z-index: 10;
                `;
                finalMessage.textContent = "¡Buena suerte allá!!!";
                document.getElementById('game-container').appendChild(finalMessage);

                setTimeout(() => {
                    finalMessage.remove();
                    showTutorial();
                }, 2000);
            }, 1000);
        }

        // Mostrar tutorial
        function showTutorial() {
            document.getElementById('white-transition').style.opacity = '0';
            document.getElementById('tutorial-screen').style.display = 'flex';
        }

        // Iniciar juego
        function startGame() {
            alert(`¡${playerName}, tu aventura en Wolfy World comienza ahora!`);
            // Aquí iría el código del juego principal
        }

        // Permitir Enter en el input
        document.getElementById('nickname-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitName();
            }
        });

        // Iniciar al cargar
        window.onload = startDialogue;
    </script>
</body>
</html>
