<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolfy World</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Pantalla de diálogo inicial -->
        <div id="dialogue-screen">
            <div class="dialogue-box">
                <div class="speaker-name" id="speaker">???</div>
                <div class="dialogue-text" id="dialogue-text"></div>
                <button class="continue-btn" id="continue-btn" onclick="nextDialogue()">Continuar ▶</button>
            </div>
        </div>

        <!-- Input de nombre -->
        <div id="name-input-screen">
            <div class="name-input-container">
                <h2>¿Cómo te llamas?</h2>
                <input type="text" id="nickname-input" placeholder="Tu nombre..." maxlength="20">
                <br>
                <button class="continue-btn" onclick="submitName()">Aceptar</button>
            </div>
        </div>

        <!-- Pantalla de carga -->
        <div id="loading-screen">
            <div class="loading-text">Cargando datos básicos...</div>
            <div class="loading-bar-container">
                <div class="loading-bar" id="loading-bar"></div>
            </div>
            <div class="loading-percentage" id="loading-percentage">0%</div>
        </div>

        <!-- Transición a blanco -->
        <div id="white-transition"></div>

        <!-- Tutorial -->
        <div id="tutorial-screen">
            <h1 class="tutorial-title">Conoce a tus compañeros</h1>
            <div class="characters-grid">
                <div class="character-card">
                    <div class="character-icon">🐺</div>
                    <div class="character-name">Lobito</div>
                    <div class="character-role">El líder valiente</div>
                </div>
                <div class="character-card">
                    <div class="character-icon">⚔️</div>
                    <div class="character-name">Lobito Espadachín</div>
                    <div class="character-role">Maestro del combate</div>
                </div>
                <div class="character-card">
                    <div class="character-icon">🏹</div>
                    <div class="character-name">Lobito Arquero</div>
                    <div class="character-role">Precisión letal</div>
                </div>
                <div class="character-card">
                    <div class="character-icon">📚</div>
                    <div class="character-name">Lobito Escolar</div>
                    <div class="character-role">Estratega inteligente</div>
                </div>
            </div>
            <button class="start-game-btn" onclick="startGame()">¡Comenzar Aventura!</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
