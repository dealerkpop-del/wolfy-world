<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolfy World - Inicio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Diálogo -->
        <div id="dialogue-screen">
            <div class="dialogue-box">
                <div class="speaker-name" id="speaker">???</div>
                <div class="dialogue-text" id="dialogue-text"></div>
                <button class="continue-btn" id="continue-btn" onclick="nextDialogue()">Continuar ▶</button>
            </div>
        </div>

        <!-- Input Nombre -->
        <div id="name-input-screen">
            <div class="name-input-container">
                <h2>¿Cómo te llamas, viajero?</h2>
                <input type="text" id="nickname-input" placeholder="Tu nombre..." maxlength="15">
                <br>
                <button class="continue-btn" onclick="submitName()">Aceptar</button>
            </div>
        </div>

        <!-- Carga -->
        <div id="loading-screen">
            <div class="loading-text">Cargando mundo Wolfy...</div>
            <div class="loading-bar-container"><div class="loading-bar" id="loading-bar"></div></div>
            <div class="loading-percentage" id="loading-percentage">0%</div>
        </div>

        <!-- Transición -->
        <div id="white-transition"></div>

        <!-- Tutorial -->
        <div id="tutorial-screen">
            <h1 class="tutorial-title">Tu equipo inicial</h1>
            <p class="tutorial-sub">Cada Lobito controla un color de orbe</p>
            <div class="characters-grid">
                <div class="character-card"><div class="character-icon">⬜</div><div class="character-name">Lobito</div><div class="character-role">Neutral</div></div>
                <div class="character-card"><div class="character-icon"></div><div class="character-name">Espadachín</div><div class="character-role">Dominancia</div></div>
                <div class="character-card"><div class="character-icon"></div><div class="character-name">Arquero</div><div class="character-role">Precisión</div></div>
                <div class="character-card"><div class="character-icon"></div><div class="character-name">Escolar</div><div class="character-role">Inteligencia</div></div>
            </div>
            <button class="start-game-btn" onclick="startGame()">¡Comenzar Aventura!</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
